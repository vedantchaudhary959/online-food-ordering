
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | ABES.BITE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">
            ABES<span>.BITE</span>
        </a>
        <a href="index.html" class="login-btn">Back to Home</a>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-heading">
                <h1>Welcome to ABES.BITE!</h1>
                <p>Sign in to discover and order your favourite food.</p>
            </div>

            <div class="account-tabs">
                <button type="button" class="account-tab active"
                    id="phone-tab" onclick="showLogin('phone')">
                    Phone Number
                </button>

                <button type="button" class="account-tab"
                    id="email-tab" onclick="showLogin('email')">
                    Email
                </button>
            </div>

            <!-- PHONE LOGIN -->

            <form id="phone-form">
                <div id="recaptcha-container"></div>

                <label for="phone">Mobile Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your 10-digit number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

                <button type="submit" class="auth-submit">
                    Continue with OTP
                </button>

            </form>

            <!-- EMAIL LOGIN -->

            <form id="email-form" style="display:none;">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your personal email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Login with Email
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            
<button type="button" class="google-btn" id="google-login">
    <svg width="20" height="20" viewBox="0 0 48 48"
         aria-hidden="true">
        <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.28 5.48-4.84 7.18l7.73 6C44.34 38.03 46.98 31.89 46.98 24.55z"/>
        <path fill="#FBBC05"
              d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.51 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
</button>

            <p class="auth-switch">
                New to ABES.BITE?
                <a href="student-register.html">Create an account</a>
            </p>

            <p id="login-message"></p>

        </div>

    </main>

   <script type="module" src="student-auth.js"></script>
</body>
</html>
