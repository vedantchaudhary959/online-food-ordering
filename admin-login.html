
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ABES.BITE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <header class="navbar">

        <a href="index.html" class="logo">
            ABES<span>.BITE</span>
        </a>

        <a href="index.html" class="login-btn">
            Back to Home
        </a>

    </header>

    <main class="auth-container">

        <div class="auth-card admin-login-card">

            <div class="admin-icon">
                <span>🛡️</span>
            </div>

            <div class="auth-heading">

                <span class="owner-label">ADMINISTRATION PORTAL</span>

                <h1>Admin Login</h1>

                <p>
                    Sign in to manage ABES.BITE and review
                    store registration applications.
                </p>

            </div>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Administrator Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

                <p style="text-align: right; margin: 8px 0 18px;">
                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>
                </p>

                <button type="submit" class="auth-submit">
                    Access Admin Panel
                </button>

            </form>

            <p id="admin-message"></p>

            <div class="admin-security-note">

                <strong>Restricted Access</strong>

                <p>
                    This portal is exclusively for authorised
                    ABES.BITE administrators.
                </p>

            </div>

        </div>

    </main>

    <script type="module" src="admin-auth.js"></script>

</body>
</html>
