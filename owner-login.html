
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Owner Login | ABES.BITE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <header class="navbar">

        <a href="index.html" class="logo">
            ABES<span>.BITE</span>
        </a>

        <a href="index.html" class="login-btn">
            Back to Home
        </a>

    </header>


    <main class="auth-container">

        <div class="auth-card owner-login-card">

            <div class="owner-icon">
                <span>🏪</span>
            </div>

            <div class="auth-heading">

                <span class="owner-label">STORE OWNER PORTAL</span>

                <h1>Welcome Back!</h1>

                <p>
                    Login to manage your store, menu and orders.
                </p>

            </div>


            <form id="owner-login-form">

                <label for="owner-email">
                    Registered Email Address
                </label>

                <input
                    type="email"
                    id="owner-email"
                    placeholder="Enter your registered email"
                    required
                >


                <label for="owner-password">
                    Password
                </label>

                <input
                    type="password"
                    id="owner-password"
                    placeholder="Enter your password"
                    required
                >

                <div class="forgot-password">
                    <a href="#" id="forgot-password">
                        Forgot Password?
                    </a>
                </div>


                <button type="submit" class="auth-submit">
                    Login to Store Dashboard
                </button>

            </form>


            <div class="auth-divider">
                <span>NEW TO ABES.BITE?</span>
            </div>


            <div class="owner-register-box">

                <p>
                    Don't have a registered store?
                </p>

                <a href="store-registration.html">
                    Apply to Register Your Store →
                </a>

            </div>


            <p id="owner-login-message"></p>

        </div>

    </main>


    <script type="module" src="owner-auth.js"></script>

</body>
</html>
