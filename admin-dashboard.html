
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ABES.BITE</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-dashboard {
            min-height: 100vh;
            background: #FFF9EC;
        }

        .dashboard-header {
            background: #4F101B;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h2 {
            margin: 0;
        }

        .dashboard-header a {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 9px 16px;
            border-radius: 6px;
        }

        .dashboard-content {
            padding: 35px 5%;
        }

        .dashboard-content h1 {
            color: #4F101B;
            margin-bottom: 8px;
        }

        .dashboard-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            border-left: 5px solid #E5B817;
        }

        .stat-card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .stat-card p {
            color: #4F101B;
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .applications-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .applications-section h2 {
            color: #4F101B;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .applications-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .applications-table th,
        .applications-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .applications-table th {
            color: #4F101B;
            background: #FFF9EC;
        }

        .status-pending {
            color: #9A6900;
            font-weight: bold;
        }

        .approve-btn, .reject-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
        }

        .approve-btn {
            background: #e5f5e9;
            color: #187438;
        }

        .reject-btn {
            background: #fbe7e7;
            color: #a32222;
        }

        .dashboard-note {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .dashboard-header {
                gap: 15px;
                flex-wrap: wrap;
            }

            .dashboard-content {
                padding: 25px 4%;
            }

            .applications-section {
                padding: 15px;
            }
        }
    </style>
</head>

<body >
<div class="admin-dashboard">

    <header class="dashboard-header">
        <h2>ABES.BITE Admin</h2>
        <a href="#" id="adminLogout">Logout</a>
    </header>

    <main class="dashboard-content">

        <h1>Admin Dashboard</h1>
        <p class="dashboard-subtitle">
            Manage campus stores and registration applications.
        </p>

        <section class="dashboard-stats">

            <div class="stat-card">
                <h3>Total Stores</h3>
                <p id="totalStores">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending Applications</h3>
                <p id="pendingApplications">2</p>
            </div>

            <div class="stat-card">
                <h3>Approved Stores</h3>
                <p id="approvedStores">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

        </section>

        <section class="applications-section">
            <h2>Store Registration Applications</h2>

            <div class="table-wrapper">
                <table class="applications-table">
                    <thead>
                        <tr>
    <th>Owner Name</th>
    <th>Store Name</th>
    <th>Category</th>
    <th>Location</th>
    <th>Status</th>
    <th>Action</th>
</tr>
                        
                    </thead>

                    <tbody id="applicationsList">
</tbody>
                </table>
            </div>

            <p id="dashboardMessage" class="dashboard-note">
    Loading applications...
</p>
        </section>

    </main>
</div>

<script type="module" src="./admin-dashboard.js"></script>


</body>
</html>
