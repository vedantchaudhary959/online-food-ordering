
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ABES.BITE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            ABES<span>.BITE</span>
        </a>

        <a href="cart.html" class="login-btn">Back to Cart</a>
    </header>

    <main class="dashboard-content">

        <h1>Checkout</h1>
        <p>Review your order before confirming.</p>

        <section class="checkout-section">
            <h2>Order Details</h2>
            <div id="checkout-items">Loading your order...</div>
            <h3 id="checkout-total">Total: ₹0</h3>
        </section>

        <section class="checkout-section">
            <h2>Student Details</h2>

            <label for="student-name">Full Name</label>
            <input type="text" id="student-name"
                placeholder="Enter your full name" required>

            <label for="student-phone">Mobile Number</label>
            <input type="tel" id="student-phone"
                placeholder="Enter your 10-digit mobile number"
                maxlength="10" pattern="[0-9]{10}" required>

            <label for="student-location">Pickup Location</label>
            <input type="text" id="student-location"
                placeholder="Enter your preferred pickup location"
                required>

            <button id="place-order-btn" class="primary-btn">
                Confirm Order
            </button>

            <p id="checkout-message"></p>
        </section>

    </main>

    <script type="module" src="checkout.js"></script>

</body>
</html>
